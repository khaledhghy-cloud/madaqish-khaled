
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مداقش خالد</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#102d23;color:white;font-family:Arial;text-align:center}
header{padding:20px;background:#091d17;border-bottom:2px solid #b58a42}
h1{color:#f5d47a;font-size:30px}
.teams{display:flex;gap:10px;padding:12px}
.team{flex:1;padding:15px;border-radius:12px;font-weight:bold}
.red{background:#762b2b}
.blue{background:#17477e}
.table{margin:10px auto;padding:15px;max-width:650px;min-height:390px;border:9px solid #805333;border-radius:35px;background:radial-gradient(#176044,#073b29)}
.players{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.player{border:2px solid #c8a45d;border-radius:12px;padding:10px;background:#10271f}
.player.redteam{border-color:#d45c5c}
.player.blueteam{border-color:#4e9bdf}
.player.current{outline:3px solid #f5d47a}
.score{color:#f5d47a;font-weight:bold}
.status{font-size:12px;color:#f5d47a;margin-top:5px}
.backcards{display:flex;justify-content:center;margin-top:7px}
.back{width:20px;height:32px;margin-left:-6px;border:2px solid white;border-radius:4px;background:repeating-linear-gradient(45deg,#8e343b,#8e343b 3px,#f2dfce 3px,#f2dfce 5px)}
.market{margin:20px auto;padding:12px;width:180px;background:#111;border:3px solid #d3ae62;border-radius:20px}
.market strong{display:block;font-size:35px;color:#f5d47a}
.hand{display:flex;justify-content:center;gap:5px;margin:15px auto;direction:ltr}
.card{width:75px;height:112px;background:white;color:#171717;border:2px solid #ddd;border-radius:8px;position:relative;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 8px #001a10}
.card.reds{color:#bd242c}
.corner{position:absolute;top:4px;left:5px;font-size:17px;font-weight:bold}
.center{font-size:36px}
.bottom{position:absolute;bottom:4px;right:5px;transform:rotate(180deg);font-size:17px;font-weight:bold}
.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:14px auto}
button{border:1px solid #d6b66c;border-radius:13px;padding:13px 16px;font-size:16px;font-weight:bold;color:white;background:#183b2c}
.gold{background:#d8ad4e;color:#241a0a}
.green{background:#126d36}
.redbtn{background:#842b2b}
#message{color:#f5d47a;min-height:30px;padding:8px}
@media(max-width:390px){.card{width:65px;height:100px}.player{padding:7px 2px}}
</style>
</head>
<body>
<header>
<h1>♠ مداقش خالد ♥</h1>
لعبة الأصدقاء
</header>

<div class="teams">
<div class="team red">الفريق الأول<br>1 - 3 - 5</div>
<div class="team blue">الفريق الثاني<br>2 - 4 - 6</div>
</div>

<div class="table">
<div class="players" id="players"></div>
<div class="market">السوق<strong id="pot">0</strong>نقطة</div>
</div>

<h3>أوراقك الأربع</h3>
<div class="hand" id="hand"></div>
<div id="message">اضغط توزيع الأوراق للبدء</div>

<div class="controls">
<button class="gold" onclick="deal()">توزيع الأوراق</button>
<button onclick="raiseBid()">زايد 5</button>
<button class="green" onclick="joinBid()">داقش</button>
<button class="redbtn" onclick="passBid()">ما داقش</button>
<button onclick="marketEntry()">سوقي</button>
</div>
<div class="controls">
<button onclick="nextRound()">الجولة التالية</button>
<button onclick="resetGame()">إعادة اللعبة</button>
</div>

<script>
const players=[
{name:"اللاعب 1",team:1,score:100},
{name:"اللاعب 2",team:2,score:100},
{name:"اللاعب 3",team:1,score:100},
{name:"اللاعب 4",team:2,score:100},
{name:"اللاعب 5",team:1,score:100},
{name:"اللاعب 6",team:2,score:100}
];
const types=[
{rank:"A",name:"إكة",power:5,count:5},
{rank:"K",name:"باشا",power:4,count:5},
{rank:"Q",name:"بنت",power:3,count:5},
{rank:"J",name:"ولد",power:2,count:5},
{rank:"10",name:"عشرة",power:1,count:4}
];
const suits=["♠","♥","♦","♣"];
let hands=[],turn=0,pot=0,dealt=false;
let active=[],passed=[],marketPlayers=[];

function makeDeck(){
let deck=[];
types.forEach(t=>{
for(let i=0;i<t.count;i++){
deck.push({...t,suit:suits[Math.floor(Math.random()*4)]});
}});
for(let i=deck.length-1;i>0;i--){
let j=Math.floor(Math.random()*(i+1));
[deck[i],deck[j]]=[deck[j],deck[i]];
}
return deck;
}
function deal(){
let deck=makeDeck();
hands=[];
for(let i=0;i<6;i++)hands.push(deck.slice(i*4,i*4+4));
turn=0;pot=0;active=[];passed=[];marketPlayers=[];
dealt=true;
message("تم التوزيع. يبدأ اللاعب 1 ثم 2 ثم 3 ثم 4 ثم 5 ثم 6.");
update();
}
function renderPlayers(){
document.getElementById("players").innerHTML=players.map((p,i)=>`
<div class="player ${p.team===1?'redteam':'blueteam'} ${turn===i?'current':''}">
<strong>${i+1}</strong><br>${p.name}
<div class="score">${p.score} نقطة</div>
<div class="backcards">${dealt?'<span class="back"></span>'.repeat(4):''}</div>
<div class="status">${passed.includes(i)?'ما داقش':active.includes(i)?'يداقش':marketPlayers.includes(i)?'سوقي':''}</div>
</div>`).join("");
}
function renderHand(){
document.getElementById("hand").innerHTML=hands[0]?hands[0].map(c=>{
let red=["♥","♦"].includes(c.suit);
return `<div class="card ${red?'reds':''}">
<div class="corner">${c.rank}<br>${c.suit}</div>
<div class="center">${c.suit}</div>
<div class="bottom">${c.rank}<br>${c.suit}</div>
</div>`;
}).join(""):"";
}
function update(){
renderPlayers();renderHand();
document.getElementById("pot").textContent=pot;
}
function message(t){document.getElementById("message").textContent=t}
function nextPlayer(){
let count=0;
do{turn=(turn+1)%6;count++}
while(passed.includes(turn)&&count<6);
update();
}
function raiseBid(){
if(!dealt)return message("وزع الأوراق أولاً");
if(passed.includes(turn))return message("هذا اللاعب خرج من المزايدة");
active.push(turn);active=[...new Set(active)];
pot+=5;
message("اللاعب "+(turn+1)+" زايد 5 نقاط");
nextPlayer();
}
function joinBid(){
if(!dealt)return message("وزع الأوراق أولاً");
active.push(turn);active=[...new Set(active)];
message("اللاعب "+(turn+1)+" يداقش");
nextPlayer();
}
function passBid(){
if(!dealt)return message("وزع الأوراق أولاً");
passed.push(turn);
message("اللاعب "+(turn+1)+" ما داقش");
nextPlayer();
}
function marketEntry(){
if(!dealt)return message("وزع الأوراق أولاً");
marketPlayers.push(turn);active.push(turn);
active=[...new Set(active)];
marketPlayers=[...new Set(marketPlayers)];
message("اللاعب "+(turn+1)+" قال سوقي");
nextPlayer();
}
function nextRound(){
hands=[];dealt=false;turn=0;pot=0;
active=[];passed=[];marketPlayers=[];
message("الجولة الجديدة. اضغط توزيع الأوراق.");
update();
}
function resetGame(){
players.forEach(p=>p.score=100);
nextRound();
}
update();
</script>
</body>
</html>
