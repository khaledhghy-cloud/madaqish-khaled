
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مداقش خالد</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:12px;background:#09291f;color:white;font-family:Arial;text-align:center}
h1{color:#f2cc70}
.subtitle,.note{color:#d8c58d}
.table{background:radial-gradient(#126044,#073526);border:8px solid #805633;border-radius:30px;padding:12px;margin:auto;max-width:850px}
.players{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.player{border:3px solid #398bd0;border-radius:18px;padding:10px 4px;min-height:125px;background:#102d25}
.player.odd{border-color:#c64d52}
.player.active{outline:4px solid #e9c15f}
.player strong{font-size:23px}
.score{color:#f3ce70;font-weight:bold;margin:7px}
.status{font-size:12px;color:#ddd;min-height:18px}
.market{margin:20px auto;background:#111;border:5px solid #d9ad53;border-radius:25px;padding:12px;width:210px}
.amount{font-size:42px;color:#f3ce70;font-weight:bold}
.panel{background:#123b2d;border:2px solid #d9ad53;border-radius:18px;padding:14px;margin:16px auto;max-width:650px}
.controls{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin:12px auto}
button{border:2px solid #d9ad53;border-radius:15px;padding:12px 16px;font-size:16px;font-weight:bold;background:#174c38;color:white}
button.gold{background:#d9ad53;color:#171717}
button.red{background:#8a2929}
button:disabled{opacity:.4}
input{width:115px;padding:12px;border-radius:10px;font-size:19px;text-align:center}
#message{color:#f4d17c;min-height:42px;margin:14px}
.cards{display:flex;justify-content:center;gap:7px;flex-wrap:wrap}
.card{background:white;color:#171717;border-radius:10px;width:65px;height:98px;padding:8px;text-align:left;font-size:23px;font-weight:bold}
.card.red{color:#c62828}
.card small{display:block;margin-top:5px;font-size:22px}
.hidden{display:none}
.log{text-align:right;max-height:170px;overflow:auto;font-size:14px;line-height:1.8}
.result{color:#f4d17c;font-size:19px}
.note{font-size:12px;margin:15px}
</style>
</head>
<body>

<h1>مداقش خالد</h1>
<div class="subtitle">لعبة الورق - ستة لاعبين</div>

<div class="table">
  <div class="players" id="players"></div>
  <div class="market">
    <div>أعلى مزايدة</div>
    <div class="amount" id="pot">0</div>
    <div>نقطة</div>
  </div>
</div>

<div class="panel">
  <h3 id="stageTitle">المزايدة</h3>
  <div id="turnName"></div>
  <div id="message">اضغط توزيع الأوراق لبدء اللعب</div>

  <div class="controls" id="auctionControls">
    <input id="bidAmount" type="number" min="5" step="5" placeholder="المبلغ">
    <button class="gold" onclick="makeBid()">اعتماد المزايدة</button>
    <button onclick="goAllIn()">سوقي</button>
    <button class="red" onclick="withdraw()">انسحاب</button>
  </div>
  <div id="stageControls"></div>
</div>

<div class="panel">
  <h3>أوراق اللاعب الحالي</h3>
  <div class="cards" id="myCards"></div>
  <div class="note">لا تظهر أوراق الزملاء أثناء طلب المشاركة.</div>
</div>

<div class="panel">
  <h3>سجل اللعبة</h3>
  <div class="log" id="history">لا يوجد سجل بعد</div>
</div>

<div class="controls">
  <button class="gold" onclick="deal()">توزيع الأوراق</button>
  <button onclick="nextRound()">الجولة التالية</button>
  <button class="red" onclick="resetGame()">إعادة اللعبة</button>
</div>

<div class="panel hidden" id="resultPanel">
  <h3>نتيجة المداقشة</h3>
  <div id="resultText" class="result"></div>
  <div id="revealedHands"></div>
</div>

<div class="panel hidden" id="sharePanel">
  <h3>توزيع مكسب السوق</h3>
  <div id="shareInfo"></div>
  <div id="shareInputs"></div>
  <button class="gold" onclick="distributeMarket()">اعتماد التوزيع</button>
</div>

<div class="note">
الفريق الأول: 1 و3 و5 — الفريق الثاني: 2 و4 و6
</div>

<script>
const players=Array.from({length:6},(_,i)=>({
  name:"اللاعب "+(i+1),
  score:100,
  hand:[],
  eliminated:false,
  secondChance:false
}));

let round=1,starter=0,turn=0,actions=0;
let highestBid=0,highestBidder=-1;
let bids=Array(6).fill(0);
let acted=Array(6).fill(false);
let withdrawn=Array(6).fill(false);
let allIn=Array(6).fill(false);
let dealt=false,stage="ready";
let participants=[],invited=[],inviteIndex=0;
let history=[];
let matchOver=false;

function teamOf(i){return i%2;}

function makeDeck(){
  const deck=[];
  const suits=["♠","♥","♦","♣"];
  const ranks=[
    ["A",5,5],["K",4,5],["Q",3,5],
    ["J",2,5],["10",1,4]
  ];
  ranks.forEach(([name,value,count])=>{
    for(let i=0;i<count;i++)
      deck.push({name,value,symbol:suits[i%4]});
  });
  return deck.sort(()=>Math.random()-.5);
}

function say(t){
  document.getElementById("message").textContent=t;
}

function log(t){
  history.unshift(t);
  document.getElementById("history").innerHTML=
    history.map(x=>"<div>"+x+"</div>").join("");
}

function deal(){
  if(matchOver){
    say("انتهت المباراة. اضغط إعادة اللعبة لبدء مباراة جديدة.");
    return;
  }

  const alive=players.filter(p=>!p.eliminated);
  if(alive.length<2){
    say("لا يوجد عدد كافٍ من اللاعبين.");
    return;
  }

  const deck=makeDeck();
  players.forEach((p,i)=>{
    p.hand=deck.slice(i*4,i*4+4);
  });

  starter=(round-1)%6;
  turn=starter;
  actions=0;
  highestBid=0;
  highestBidder=-1;
  bids=Array(6).fill(0);
  acted=Array(6).fill(false);
  withdrawn=Array(6).fill(false);
  allIn=Array(6).fill(false);
  participants=[];
  invited=[];
  inviteIndex=0;
  history=[];
  dealt=true;
  stage="auction";

  document.getElementById("resultPanel").classList.add("hidden");
  document.getElementById("sharePanel").classList.add("hidden");
  document.getElementById("stageControls").innerHTML="";
  log("بدأت الجولة "+round);
  say("بدأت الجولة من اللاعب "+(starter+1));
  skipEliminated();
  update();
}

function skipEliminated(){
  while(actions<6 && players[turn].eliminated){
    actions++;
    turn=(starter+actions)%6;
  }
  if(actions>=6)endAuction();
}

function update(){
  const area=document.getElementById("players");
  area.innerHTML="";

  players.forEach((p,i)=>{
    const div=document.createElement("div");
    const active=(stage==="auction"&&turn===i)||
      (stage==="consult"&&invited[inviteIndex]===i);

    div.className="player "+(i%2===0?"odd":"")+
      (active?" active":"");

    let status="";
    if(p.eliminated)status="خارج اللعبة";
    else if(withdrawn[i])status="منسحب";
    else if(allIn[i])status="سوقي";
    else if(acted[i]&&bids[i]>0)status="زايد "+bids[i];
    else if(participants.includes(i))status="يداقش";

    div.innerHTML="<strong>"+(i+1)+"</strong>"+
      "<div>"+p.name+"</div>"+
      '<div class="score">'+p.score+" نقطة</div>"+
      '<div class="status">'+status+"</div>";

    area.appendChild(div);
  });

  document.getElementById("pot").textContent=highestBid;

  document.getElementById("stageTitle").textContent=
    stage==="auction"?"المزايدة":
    stage==="consult"?"طلبات الدقش":
    stage==="compare"?"المقارنة":"اللعبة";

  document.getElementById("turnName").textContent=
    stage==="auction"?"دور اللاعب "+(turn+1):
    stage==="consult"?"طلبات مشاركة الزملاء":"";

  document.getElementById("auctionControls").classList.toggle(
    "hidden",stage!=="auction"
  );

  renderCurrentCards();
}

function renderCurrentCards(){
  const box=document.getElementById("myCards");
  box.innerHTML="";
  if(!dealt||stage!=="auction"||players[turn].eliminated)return;

  players[turn].hand.forEach(c=>{
    const el=document.createElement("div");
    el.className="card "+("♥♦".includes(c.symbol)?"red":"");
    el.innerHTML=c.name+"<small>"+c.symbol+"</small>";
    box.appendChild(el);
  });
}

function advance(){
  actions++;
  if(actions>=6){
    endAuction();
    return;
  }
  turn=(starter+actions)%6;
  skipEliminated();
  if(stage==="auction"){
    say("المزايدة الحالية "+highestBid+
      " نقطة. دور اللاعب "+(turn+1));
    update();
  }
}

function makeBid(){
  if(stage!=="auction"||acted[turn]||players[turn].eliminated)return;

  const amount=Number(document.getElementById("bidAmount").value);

  if(!Number.isInteger(amount)||amount<5||amount%5!==0)
    return say("المزايدة تبدأ من 5 وتكون بالخمسات.");

  if(amount<=highestBid)
    return say("يجب أن تكون أعلى من "+highestBid+".");

  if(amount>players[turn].score)
    return say("المبلغ أكبر من رصيد اللاعب. استخدم سوقي.");

  bids[turn]=amount;
  acted[turn]=true;
  highestBid=amount;
  highestBidder=turn;

  log("اللاعب "+(turn+1)+" زايد "+amount);
  document.getElementById("bidAmount").value="";
  advance();
}

function goAllIn(){
  if(stage!=="auction"||acted[turn]||players[turn].eliminated)return;

  const amount=players[turn].score;
  acted[turn]=true;
  allIn[turn]=true;
  bids[turn]=amount;

  if(amount>highestBid){
    highestBid=amount;
    highestBidder=turn;
  }

  log("اللاعب "+(turn+1)+" قال سوقي برصيد "+amount);
  advance();
}

function withdraw(){
  if(stage!=="auction"||acted[turn]||players[turn].eliminated)return;
  acted[turn]=true;
  withdrawn[turn]=true;
  bids[turn]=0;
  log("اللاعب "+(turn+1)+" انسحب من المزايدة");
  advance();
}

function endAuction(){
  if(highestBidder===-1){
    stage="done";
    say("انتهت المزايدة دون مزايد.");
    document.getElementById("stageControls").innerHTML=
      '<button class="gold" onclick="nextRound()">الجولة التالية</button>';
    update();
    return;
  }

  stage="consult";
  participants=[highestBidder];

  const ownerTeam=teamOf(highestBidder);
  const opponentTeam=1-ownerTeam;

  // مشاركة لاعبي الفريق المنافس الذين زايدوا أو قالوا سوقي.
  for(let i=0;i<6;i++){
    if(teamOf(i)===opponentTeam&&!withdrawn[i]&&
       !players[i].eliminated&&(bids[i]>0||allIn[i])){
      participants.push(i);
    }
  }

  // صاحب السوق يستشير زملاءه الذين زايدوا أو قالوا سوقي.
  invited=[];
  for(let i=0;i<6;i++){
    if(teamOf(i)===ownerTeam&&i!==highestBidder&&
       !withdrawn[i]&&!players[i].eliminated&&
       (bids[i]>0||allIn[i])){
      invited.push(i);
    }
  }

  inviteIndex=0;
  log("صاحب السوق اللاعب "+(highestBidder+1)+
      " بمبلغ "+highestBid);
  say("صاحب السوق يداقش إجباريًا. تبدأ طلبات زملائه.");
  showInvitation();
}

function showInvitation(){
  const controls=document.getElementById("stageControls");
  controls.innerHTML="";

  if(inviteIndex>=invited.length){
    controls.innerHTML=
      '<button class="gold" onclick="compareHands()">بدء المقارنة</button>';
    say("انتهت طلبات المشاركة. اضغط بدء المقارنة.");
    update();
    return;
  }

  const player=invited[inviteIndex];
  say("هل اللاعب "+(player+1)+" يوافق على الدقش؟");

  controls.innerHTML=
    '<div>طلب مشاركة للاعب '+(player+1)+'</div>'+
    '<div class="controls">'+
    '<button class="gold" onclick="answerInvite(true)">نعم</button>'+
    '<button class="red" onclick="answerInvite(false)">لا</button>'+
    '</div>';

  update();
}

function answerInvite(yes){
  const player=invited[inviteIndex];

  if(yes){
    participants.push(player);
    log("اللاعب "+(player+1)+" وافق على الدقش");
  }else{
    log("اللاعب "+(player+1)+" رفض الدقش");
  }

  inviteIndex++;
  showInvitation();
}

function evaluateHand(hand){
  const counts={};
  hand.forEach(c=>counts[c.value]=(counts[c.value]||0)+1);

  const groups=Object.entries(counts)
    .map(([value,count])=>({value:Number(value),count}))
    .sort((a,b)=>b.value-a.value);

  const four=groups.find(g=>g.count===4);
  if(four)return {category:5,rank:four.value,name:"أربع ورقات"};

  const triple=groups.find(g=>g.count===3);
  if(triple)return {category:4,rank:triple.value,name:"ثلاثية"};

  const pairs=groups.filter(g=>g.count===2)
    .sort((a,b)=>b.value-a.value);

  if(pairs.length===2)
    return {category:3,rank:pairs[0].value,
      second:pairs[1].value,name:"زوجان"};

  if(pairs.length===1)
    return {category:2,rank:pairs[0].value,name:"زوج"};

  return {category:1,rank:groups[0].value,name:"أعلى ورقة"};
}

function compareScore(a,b){
  return b.category-a.category||
    b.rank-a.rank||
    (b.second||0)-(a.second||0);
}

function checkElimination(){
  const out=[0,0];

  players.forEach((p,i)=>{
    if(p.eliminated)out[teamOf(i)]++;
  });

  if(out[0]>=2||out[1]>=2){
    matchOver=true;
    stage="done";
    const winningTeam=out[0]>=2?2:1;
    say("انتهت المباراة! الفريق "+winningTeam+" فاز.");
    document.getElementById("resultText").textContent=
      "الفريق "+winningTeam+" فاز بالمباراة.";
    document.getElementById("stageControls").innerHTML=
      '<button class="red" onclick="resetGame()">إعادة المباراة</button>';
    document.getElementById("sharePanel").classList.add("hidden");
    update();
    return true;
  }
  return false;
}

function settle(winner){
  const owner=highestBidder;

  if(winner===owner){
    players[owner].score+=highestBid;

    // اللاعبون المنافسون المشاركون يخسرون مبالغهم.
    participants.forEach(i=>{
      if(teamOf(i)!==teamOf(owner)){
        players[i].score=Math.max(0,players[i].score-bids[i]);
      }
    });
  }else{
    // صاحب السوق يخسر كامل مزايدته.
    players[owner].score=Math.max(0,players[owner].score-highestBid);

    // كل مشارك آخر يخسر مبلغ دخوله، حتى الفائز.
    participants.forEach(i=>{
      if(i!==owner){
        players[i].score=Math.max(0,players[i].score-bids[i]);
      }
    });

    // الفائز يأخذ أعلى مزايدة.
    players[winner].score+=highestBid;
  }

  participants.forEach(i=>{
    const p=players[i];

    if(p.score>0){
      p.secondChance=false;
    }else if(p.secondChance){
      p.eliminated=true;
      log("اللاعب "+(i+1)+" خرج من اللعبة بعد خسارته فرصته الثانية");
    }else{
      p.secondChance=true;
      log("اللاعب "+(i+1)+" وصل للصفر وله فرصة ثانية");
    }
  });
}

function compareHands(){
  stage="compare";

  const results=participants.map(i=>({
    player:i,
    score:evaluateHand(players[i].hand),
    hand:players[i].hand
  }));

  results.sort((a,b)=>compareScore(a.score,b.score));

  const best=results[0];
  const tied=results.filter(r=>compareScore(r.score,best.score)===0);

  const panel=document.getElementById("resultPanel");
  panel.classList.remove("hidden");

  let html="";
  results.forEach(r=>{
    html+='<div class="panel"><b>اللاعب '+(r.player+1)+
      '</b> — '+r.score.name+'<div class="cards">';

    r.hand.forEach(c=>{
      html+='<div class="card '+("♥♦".includes(c.symbol)?"red":"")+'">'+
        c.name+'<small>'+c.symbol+'</small></div>';
    });

    html+='</div></div>';
  });

  document.getElementById("revealedHands").innerHTML=html;

  if(tied.length>1){
    document.getElementById("resultText").textContent=
      "تعادل بين اللاعبين: "+
      tied.map(r=>r.player+1).join(" و")+
      ". لم يتم احتساب النقاط.";
    say("تعادل في المقارنة.");
  }else{
    settle(best.player);
    document.getElementById("resultText").textContent=
      "الفائز اللاعب "+(best.player+1)+
      " — "+best.score.name+
      " — مبلغ السوق "+highestBid+" نقطة";
    say("الفائز اللاعب "+(best.player+1)+". تم احتساب النقاط.");

    if(best.player===highestBidder){
      showSharePanel();
    }
  }

  stage="done";
  document.getElementById("stageControls").innerHTML=
    '<button class="gold" onclick="nextRound()">الجولة التالية</button>';

  update();
  checkElimination();
}

function showSharePanel(){
  const owner=highestBidder;
  const mates=players.map((p,i)=>
    i!==owner&&teamOf(i)===teamOf(owner)?i:-1
  ).filter(i=>i!==-1&&!players[i].eliminated);

  if(mates.length===0)return;

  document.getElementById("sharePanel").classList.remove("hidden");
  document.getElementById("shareInfo").textContent=
    "مكسب السوق "+highestBid+" نقطة. وزّع ما تريد على زملائك، والباقي لك.";

  let html="";
  mates.forEach(i=>{
    html+='<div class="controls">حصة اللاعب '+(i+1)+
      '<input type="number" id="share-'+i+
      '" min="0" step="1" value="0"></div>';
  });

  document.getElementById("shareInputs").innerHTML=html;
}

function distributeMarket(){
  if(highestBidder<0)return;

  const owner=highestBidder;
  const mates=players.map((p,i)=>
    i!==owner&&teamOf(i)===teamOf(owner)?i:-1
  ).filter(i=>i!==-1&&!players[i].eliminated);

  let total=0;
  const amounts=[];

  for(const i of mates){
    const field=document.getElementById("share-"+i);
    const value=Number(field?field.value:0);

    if(!Number.isInteger(value)||value<0){
      say("أدخل مبالغ صحيحة.");
      return;
    }

    amounts.push({player:i,amount:value});
    total+=value;
  }

  if(total>highestBid){
    say("مجموع التوزيع أكبر من مكسب السوق.");
    return;
  }

  if(document.getElementById("sharePanel").dataset.done==="yes"){
    say("تم اعتماد التوزيع مسبقًا.");
    return;
  }

  // خصم الحصص من مكسب صاحب السوق وإضافتها للزملاء.
  players[owner].score-=total;

  amounts.forEach(item=>{
    players[item.player].score+=item.amount;
  });

  document.getElementById("sharePanel").dataset.done="yes";
  document.getElementById("sharePanel").classList.add("hidden");

  log("وزع صاحب السوق "+total+" نقطة على زملائه.");
  say("تم اعتماد التوزيع. بقي لصاحب السوق "+
      (highestBid-total)+" نقطة من المكسب.");

  update();
}

function nextRound(){
  if(matchOver)return;
  round++;
  document.getElementById("sharePanel").dataset.done="";
  deal();
}

function resetGame(){
  round=1;
  matchOver=false;

  players.forEach(p=>{
    p.score=100;
    p.eliminated=false;
    p.secondChance=false;
    p.hand=[];
  });

  document.getElementById("sharePanel").dataset.done="";
  document.getElementById("sharePanel").classList.add("hidden");
  deal();
}

update();
</script>
</body>
</html>
