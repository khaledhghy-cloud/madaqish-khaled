
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مداقش خالد</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
  .hidden{display:none!important}
body{margin:0;padding:18px;background:#09291f;color:#fff;font-family:Arial,sans-serif}
h1{text-align:center;color:#f2cc70}
.panel{background:#123b2d;border:1px solid #d9ad53;border-radius:15px;padding:16px;margin:14px 0}
input,button{width:100%;padding:14px;margin:6px 0;border-radius:10px;font-size:17px}
input{background:#fff;color:#111;border:0}
button{background:#d9ad53;color:#171717;border:0;font-weight:bold}
button:disabled{opacity:.5}
.players{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.player{background:#102d25;border:1px solid #398b70;border-radius:10px;padding:12px}
.small{color:#b9d4c8;font-size:13px}
#message{padding:10px;color:#ffe08a;white-space:pre-wrap}
#cards{font-size:25px;text-align:center;letter-spacing:5px}
</style>
</head>
<body>
<h1>♠ مداقش خالد ♠</h1>

<div class="panel" id="loginPanel">
<h3>دخول اللعبة</h3>
<input id="name" placeholder="اكتب اسمك">
  <button onclick="window.loginGame()">دخول</button>
</div>

<div class="panel hidden" id="homePanel">
<h3>الغرف</h3>
<input id="roomName" placeholder="اسم الغرفة">
<button onclick="createRoom()">إنشاء غرفة جديدة</button>
<hr>
<input id="roomCode" placeholder="أدخل رمز الغرفة">
<button onclick="joinRoom()">دخول غرفة موجودة</button>
</div>

<div class="panel hidden" id="gamePanel">
<h2 id="roomTitle">الغرفة</h2>
<p>رمز الغرفة:</p>
<h1 id="code"></h1>
<p id="roomStatus">بانتظار اللاعبين</p>
<h3>اللاعبون</h3>
<div class="players" id="players"></div>
<p class="small">كل لاعب يرى أوراقه الخاصة فقط.</p>
<h3>أوراقك</h3>
<div id="cards">بانتظار بدء اللعب</div>
<div id="message"></div>
<button onclick="leaveRoom()">مغادرة الغرفة</button>
</div>

<script>
const SUPABASE_URL = "https://msyyzlwazqsglvgkffyr.supabase.co"; 
  const SUPABASE_KEY = "sb_publishable_n_jjV1oEsLZevdF7o8VrJQ_rbxgzwX6";

const db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let user=null, playerName="", room=null, myPlayer=null;
let roomChannel=null, playersChannel=null;

const $ = id => document.getElementById(id);
function show(id){$(id).classList.remove("hidden")}
function hide(id){$(id).classList.add("hidden")}
function say(t){$("message").textContent=t}

window.loginGame = async function(){
  alert("وصلنا إلى دالة الدخول");
  alert("زر الدخول يعمل");
  playerName=$("name").value.trim();
  if(!playerName)return alert("اكتب اسمك أولاً");
  say("جاري تسجيل الدخول...");
  const {data,error}=await db.auth.signInAnonymously();
  if(error){alert("تعذر الدخول: "+error.message);return}
  user=data.user;
  hide("loginPanel");
  show("homePanel");
  say("");
}

function makeCode(){
  return Math.random().toString(36).substring(2,7).toUpperCase();
}

async function createRoom(){
  if(!user)return;
  const code=makeCode();
  const {data,error}=await db.from("mdk_rooms").insert({
    room_code:code,
    room_name:$("roomName").value.trim()||"مداقش خالد",
    host_id:user.id,
    status:"waiting",
    game_state:{round:1,started:false}
  }).select().single();

  if(error){alert("تعذر إنشاء الغرفة: "+error.message);return}
  room=data;
  const joined=await addPlayer();
  if(joined)await openRoom();
}

async function joinRoom(){
  if(!user){
  alert("المستخدم غير مسجل الدخول");
  return;
}
alert("تم الوصول إلى دالة دخول الغرفة");
  const code=$("roomCode").value.trim().toUpperCase();
  if(!code)return alert("اكتب رمز الغرفة");
  const {data,error}=await db.from("mdk_rooms")
    .select("*").eq("room_code",code).maybeSingle();

  if(error||!data){alert("الغرفة غير موجودة أو لا يمكن الوصول إليها");return}
  if(data.status!=="waiting"){alert("اللعبة بدأت أو الغرفة مغلقة");return}
  room=data;
  const joined=await addPlayer();
  if(joined)await openRoom();
}

  
async function addPlayer(){

  const {data:{user:authUser},error:authError} =
    await db.auth.getUser();

  if(authError || !authUser || authUser.id !== user?.id){
    alert("تعذر التحقق من هوية المستخدم");
    return false;
  }

  const {data,error} = await db.rpc("mdk_join_room",{
    p_room_id: room.id,
    p_player_name: playerName
  });

  if(error){
    alert("تعذر الانضمام: " + error.message);
    return false;
  }

  myPlayer = data;
  return true;
}

  }

  const {data:all,error:readError}=await db
    .from("mdk_players")
    .select("player_number")
    .eq("room_id",room.id);

  if(readError){
    alert("تعذر قراءة اللاعبين: "+readError.message);
    return false;
  }

  if(all.length>=6){
    alert("الغرفة مكتملة");
    return false;
  }

  const used=all.map(p=>p.player_number);
  const number=[1,2,3,4,5,6].find(n=>!used.includes(n));

  if(!number){
    alert("لا يوجد مكان متاح");
    return false;
  }

 
const playerId = crypto.randomUUID();

const { error } = await db
  .from("mdk_players")
  .insert({
    id: playerId,
    room_id: room.id,
    user_id: userId,
    player_number: number,
    player_name: playerName,
    team_number: number % 2 === 1 ? 1 : 2,
    score: 100,
    is_connected: true
  });

if (error) {
  alert("تعذر الانضمام: " + error.message);
  return false;
}

myPlayer = {
  id: playerId,
  room_id: room.id,
  user_id: userId,
  player_number: number,
  player_name: playerName,
  team_number: number % 2 === 1 ? 1 : 2,
  score: 100,
  is_connected: true
};

return true;
 
}

async function openRoom(){
  hide("homePanel");
  show("gamePanel");
  $("roomTitle").textContent=room.room_name;
  $("code").textContent=room.room_code;
  await refreshRoom();
  subscribeRoom();
}

async function refreshRoom(){
  const {data,error}=await db.from("mdk_players")
    .select("player_number,player_name,team_number,score,is_connected")
    .eq("room_id",room.id).order("player_number");

  if(error){say("تعذر تحديث اللاعبين: "+error.message);return}
  $("players").innerHTML="";
  data.forEach(p=>{
    const div=document.createElement("div");
    div.className="player";
    div.innerHTML=
      "<b>اللاعب "+p.player_number+"</b><br>"+
      p.player_name+"<br>"+
      "<span class='small'>الفريق "+p.team_number+
      " | النقاط: "+p.score+
      " | "+(p.is_connected?"متصل":"غير متصل")+"</span>";
    $("players").appendChild(div);
  });

  $("roomStatus").textContent=data.length+" من 6 لاعبين";
}

function subscribeRoom(){
  if(roomChannel)db.removeChannel(roomChannel);
  roomChannel=db.channel("room-"+room.id)
    .on("postgres_changes",{
      event:"*",schema:"public",table:"mdk_players",
      filter:"room_id=eq."+room.id
    },()=>refreshRoom())
    .on("postgres_changes",{
      event:"UPDATE",schema:"public",table:"mdk_rooms",
      filter:"id=eq."+room.id
    },payload=>{
      room=payload.new;
      $("roomStatus").textContent="تم تحديث حالة الغرفة";
    }).subscribe();
}

async function leaveRoom(){
  if(myPlayer){
    await db.from("mdk_players")
      .update({is_connected:false})
      .eq("room_id",room.id).eq("user_id",user.id);
  }
  if(roomChannel)await db.removeChannel(roomChannel);
  room=null;myPlayer=null;
  hide("gamePanel");show("homePanel");
}

window.addEventListener("beforeunload",()=>{
  if(roomChannel)db.removeChannel(roomChannel);
});
</script>

<style>
.hidden{display:none!important}
</style>
</body>
</html>
